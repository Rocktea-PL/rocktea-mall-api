name: Django CI/CD

on:
  push:
    branches: [ test ]
  pull_request:
    branches: [ test ]

env:
  DJANGO_SETTINGS_MODULE: setup.settings
  PYTHON_VERSION: '3.12'
  CI: 'true'
  SECRET_KEY: ${{ secrets.SECRET_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/test'
    
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/django-app/dev
          git pull origin test
          source venv/bin/activate
          pip install --no-deps -r main/requirements.txt
          python main/manage.py migrate --run-syncdb
          sudo systemctl reload gunicorn-rocktea
          sudo systemctl restart celery-worker-rocktea.service
          sudo systemctl restart celery-beat-rocktea.service
          sudo systemctl restart flower-dev.service