name: Staging Deployment

on:
  workflow_run:
    workflows: ["Code Quality Check (PR/Push Validation)"]
    types:
      - completed
    branches: [ test ]

env:
  DJANGO_SETTINGS_MODULE: setup.settings
  PYTHON_VERSION: '3.12'
  CI: 'true'
  SECRET_KEY: ${{ secrets.SECRET_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'test'
    
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/django-app/dev
          git pull origin test
          source venv/bin/activate
          pip install --no-deps -r main/requirements.txt
          python main/manage.py migrate --run-syncdb
          sudo systemctl reload gunicorn-rocktea
          sudo systemctl restart celery-worker-rocktea.service
          sudo systemctl restart celery-beat-rocktea.service
          sudo systemctl restart flower-dev.service