name: Django Production Deployment

on:
  push:
    branches: [ master ]

env:
  DJANGO_SETTINGS_MODULE: setup.settings
  PYTHON_VERSION: '3.12'
  CI: 'true'
  SECRET_KEY: ${{ secrets.SECRET_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    
    steps:
    - name: Deploy to Production
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/django-app/prod
          git pull origin master
          source venv/bin/activate
          pip install --no-deps -r main/requirements.txt
          python main/manage.py migrate --run-syncdb
          sudo systemctl reload gunicorn-rocktea-prod
          sudo systemctl restart celery-worker-rocktea-prod.service
          sudo systemctl restart celery-beat-rocktea-prod.service
          sudo systemctl restart flower-prod.service